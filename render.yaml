# Blueprint для Render: веб-сервис + база одним разворотом.
# Render Dashboard → New → Blueprint → выбрать этот репозиторий → Apply.
#
# Заполнять здесь ничего не нужно: пароль генерируется при первом запуске и печатается
# в лог сервиса, а токен GIRITON и ссылка на таблицу вводятся на самом сайте («Настройки»).
services:
  - type: web
    name: vilgane
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vilgane-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true       # Render сгенерирует и сохранит сам
      - key: CRON_SECRET
        generateValue: true

databases:
  - name: vilgane-db
    plan: free
    databaseName: vilgane
    user: vilgane
