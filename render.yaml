# Blueprint для Render: веб-сервис + база одним разворотом.
# Render Dashboard → New → Blueprint → выбрать этот репозиторий.
services:
  - type: web
    name: vilgane
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vilgane-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true       # Render сгенерирует и сохранит сам
      - key: CRON_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false               # задать вручную в панели Render
      - key: GIRITON_API_TOKEN
        sync: false               # задать вручную в панели Render
      - key: GIRITON_ACTIVITY
        value: Práce (celkem)
      - key: NAMES_SHEET_URL
        sync: false               # ссылка на таблицу с ФИО — задать вручную, не хранить в публичном репо
      - key: SYNC_INTERVAL_MINUTES
        value: "60"

databases:
  - name: vilgane-db
    plan: free
    databaseName: vilgane
    user: vilgane
